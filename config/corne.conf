# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# ZMK Studio without the unlock key (same as the Lily58 and Sofle)
CONFIG_ZMK_STUDIO_LOCKING=n

# Enable support to control external power output
CONFIG_ZMK_EXT_POWER=y


# More reasonable timeouts
# 30 sec
# CONFIG_ZMK_IDLE_TIMEOUT=30000
# 15 minutes
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Display settings - prevent rapid cycling
# Blank display on idle
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y

# More stable display
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Better split communication
# Increase Bluetooth power
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep after 15 min without use (never while on USB power); any key wakes it.
CONFIG_ZMK_SLEEP=y
# Switch-off gesture and wake-up key, see tkl_power.dtsi.
CONFIG_ZMK_PM_SOFT_OFF=y
# The wake-up key's gpio-keys node is only read by the wake-up code: keep Zephyr's
# gpio-keys driver off so it doesn't fight the key matrix for the same pin.
CONFIG_INPUT_GPIO_KEYS=n
